server:
  port: ${PORT:8081}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/finsight}
    username: ${DATABASE_USERNAME:finsight}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
paypal:
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  import:
    signed-amount-direction-verified: ${PAYPAL_SIGNED_AMOUNT_DIRECTION_VERIFIED:false}
